name: "🐛 Bug Report"
description: "Report a bug."
labels: ["status: needs-triage", "type: bug"]
projects: ["T3sT3ro/5"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "Clear summary of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Create an SDF scene...
        2. Add...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      placeholder: "What should have happened."
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: "Unity and package version"
      placeholder: "e.g. Unity 6000.6.8f1, SDF Manipulator 0.1.0, Vulkan"

  - type: textarea
    id: context
    attributes:
      label: "Screenshots, Logs, or Context"
      placeholder: "Paste logs or the generated shader, attach screenshots, or add extra details."
